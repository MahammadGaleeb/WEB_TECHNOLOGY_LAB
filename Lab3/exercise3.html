<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Survey Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .progress-container {
            background: white;
            padding: 20px 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0;
            transition: width 0.4s ease;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            font-weight: 600;
        }

        .form-content {
            padding: 30px;
        }

        .question-block {
            margin-bottom: 35px;
            padding: 25px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .question-block.valid {
            border-color: #2ecc71;
            background: #f0fdf4;
        }

        .question-block.invalid {
            border-color: #e74c3c;
            background: #fef5f5;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .question-number {
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .required-badge {
            background: #e74c3c;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .question-description {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-field.invalid {
            border-color: #e74c3c;
        }

        .input-field.valid {
            border-color: #2ecc71;
        }

        textarea.input-field {
            resize: vertical;
            min-height: 100px;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .char-counter.warning {
            color: #f39c12;
        }

        .char-counter.error {
            color: #e74c3c;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .option-item label {
            cursor: pointer;
            flex: 1;
            font-size: 15px;
            color: #333;
        }

        .validation-message {
            margin-top: 10px;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .validation-message.show {
            display: block;
        }

        .validation-message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #e74c3c;
        }

        .validation-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2ecc71;
        }

        .validation-message.info {
            background: #e3f2fd;
            color: #1565c0;
            border-left: 4px solid #2196f3;
        }

        .form-actions {
            padding: 30px;
            background: #f8f9fa;
            border-top: 2px solid #e0e0e0;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f8f9ff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .validation-summary {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .validation-summary.show {
            display: block;
        }

        .validation-summary h3 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .validation-summary ul {
            margin-left: 20px;
            color: #856404;
        }

        .validation-summary li {
            margin-bottom: 5px;
        }

        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .success-modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 500px;
            animation: slideUp 0.4s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .response-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        .response-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .response-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .response-question {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .response-answer {
            color: #333;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Customer Satisfaction Survey</h1>
            <p>Help us improve our services by sharing your feedback</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0% Complete</div>
        </div>

        <form id="surveyForm">
            <div class="form-content">
                <div class="validation-summary" id="validationSummary">
                    <h3>⚠️ Please fix the following errors:</h3>
                    <ul id="errorList"></ul>
                </div>

                <div id="questionsContainer"></div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset Form</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">Submit Survey</button>
            </div>
        </form>
    </div>

    <div class="success-modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon">✓</div>
            <h2>Thank You!</h2>
            <p>Your survey has been submitted successfully. We appreciate your valuable feedback!</p>
            <div class="response-summary" id="responseSummary"></div>
            <button class="btn btn-primary" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const surveyQuestions = [
            {
                id: 'q1',
                type: 'text',
                question: 'What is your full name?',
                description: 'Please enter your first and last name',
                required: true,
                validation: {
                    minLength: 2,
                    maxLength: 50,
                    pattern: /^[a-zA-Z\s]+$/
                }
            },
            {
                id: 'q2',
                type: 'email',
                question: 'What is your email address?',
                description: 'We will use this to send you updates',
                required: true,
                validation: {
                    pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                }
            },
            {
                id: 'q3',
                type: 'radio',
                question: 'How satisfied are you with our service?',
                description: 'Select one option that best describes your experience',
                required: true,
                options: [
                    'Very Satisfied',
                    'Satisfied',
                    'Neutral',
                    'Dissatisfied',
                    'Very Dissatisfied'
                ]
            },
            {
                id: 'q4',
                type: 'checkbox',
                question: 'Which features do you use most often?',
                description: 'Select all that apply (minimum 1, maximum 3)',
                required: true,
                options: [
                    'Customer Support',
                    'Online Shopping',
                    'Mobile App',
                    'Email Notifications',
                    'Loyalty Program'
                ],
                validation: {
                    minSelections: 1,
                    maxSelections: 3
                }
            },
            {
                id: 'q5',
                type: 'textarea',
                question: 'What can we do to improve our service?',
                description: 'Please provide detailed feedback (50-500 characters)',
                required: true,
                validation: {
                    minLength: 50,
                    maxLength: 500
                }
            },
            {
                id: 'q6',
                type: 'radio',
                question: 'Would you recommend us to a friend?',
                description: 'Your honest opinion matters to us',
                required: true,
                options: [
                    'Definitely Yes',
                    'Probably Yes',
                    'Not Sure',
                    'Probably No',
                    'Definitely No'
                ]
            },
            {
                id: 'q7',
                type: 'text',
                question: 'How did you hear about us?',
                description: 'Optional - helps us understand our reach',
                required: false,
                validation: {
                    maxLength: 100
                }
            },
            {
                id: 'q8',
                type: 'checkbox',
                question: 'Which areas need improvement?',
                description: 'Select up to 4 areas',
                required: false,
                options: [
                    'Website Design',
                    'Product Quality',
                    'Delivery Speed',
                    'Customer Service',
                    'Pricing',
                    'Return Policy'
                ],
                validation: {
                    maxSelections: 4
                }
            }
        ];

        const validationState = {};
        let responses = {};

        function generateQuestions() {
            const container = document.getElementById('questionsContainer');
            
            container.innerHTML = surveyQuestions.map((q, index) => {
                validationState[q.id] = !q.required;
                
                return `
                    <div class="question-block" id="block-${q.id}">
                        <div class="question-header">
                            <div class="question-number">${index + 1}</div>
                            <div class="question-text">${q.question}</div>
                            ${q.required ? '<span class="required-badge">Required</span>' : ''}
                        </div>
                        ${q.description ? `<div class="question-description">${q.description}</div>` : ''}
                        ${generateField(q)}
                        <div class="validation-message" id="message-${q.id}"></div>
                    </div>
                `;
            }).join('');

            attachEventListeners();
            updateProgress();
        }

        function generateField(question) {
            switch (question.type) {
                case 'text':
                case 'email':
                    return `
                        <input 
                            type="${question.type}" 
                            id="${question.id}" 
                            name="${question.id}"
                            class="input-field"
                            ${question.required ? 'required' : ''}
                            ${question.validation?.maxLength ? `maxlength="${question.validation.maxLength}"` : ''}
                        />
                        ${question.validation?.maxLength ? `<div class="char-counter" id="counter-${question.id}">0 / ${question.validation.maxLength}</div>` : ''}
                    `;
                
                case 'textarea':
                    return `
                        <textarea 
                            id="${question.id}" 
                            name="${question.id}"
                            class="input-field"
                            ${question.required ? 'required' : ''}
                            ${question.validation?.maxLength ? `maxlength="${question.validation.maxLength}"` : ''}
                        ></textarea>
                        ${question.validation?.maxLength ? `<div class="char-counter" id="counter-${question.id}">0 / ${question.validation.maxLength}</div>` : ''}
                    `;
                
                case 'radio':
                    return `
                        <div class="radio-group">
                            ${question.options.map(option => `
                                <div class="option-item">
                                    <input 
                                        type="radio" 
                                        id="${question.id}-${option.replace(/\s/g, '-')}" 
                                        name="${question.id}" 
                                        value="${option}"
                                    />
                                    <label for="${question.id}-${option.replace(/\s/g, '-')}">${option}</label>
                                </div>
                            `).join('')}
                        </div>
                    `;
                
                case 'checkbox':
                    return `
                        <div class="checkbox-group">
                            ${question.options.map(option => `
                                <div class="option-item">
                                    <input 
                                        type="checkbox" 
                                        id="${question.id}-${option.replace(/\s/g, '-')}" 
                                        name="${question.id}" 
                                        value="${option}"
                                    />
                                    <label for="${question.id}-${option.replace(/\s/g, '-')}">${option}</label>
                                </div>
                            `).join('')}
                        </div>
                    `;
                
                default:
                    return '';
            }
        }

        function attachEventListeners() {
            surveyQuestions.forEach(q => {
                const field = document.getElementById(q.id);
                
                if (q.type === 'text' || q.type === 'email' || q.type === 'textarea') {
                    field.addEventListener('input', () => {
                        validateField(q);
                        updateCharCounter(q);
                    });
                    field.addEventListener('blur', () => validateField(q));
                } else if (q.type === 'radio') {
                    document.querySelectorAll(`input[name="${q.id}"]`).forEach(radio => {
                        radio.addEventListener('change', () => validateField(q));
                    });
                } else if (q.type === 'checkbox') {
                    document.querySelectorAll(`input[name="${q.id}"]`).forEach(checkbox => {
                        checkbox.addEventListener('change', () => validateField(q));
                    });
                }
            });
        }

        function updateCharCounter(question) {
            if (question.validation?.maxLength) {
                const field = document.getElementById(question.id);
                const counter = document.getElementById(`counter-${question.id}`);
                const length = field.value.length;
                const max = question.validation.maxLength;
                
                counter.textContent = `${length} / ${max}`;
                
                counter.classList.remove('warning', 'error');
                if (length > max * 0.9) {
                    counter.classList.add('warning');
                }
                if (length === max) {
                    counter.classList.add('error');
                }
            }
        }

        function validateField(question) {
            const messageEl = document.getElementById(`message-${question.id}`);
            const blockEl = document.getElementById(`block-${question.id}`);
            let isValid = true;
            let message = '';
            let messageType = 'error';

            if (question.type === 'text' || question.type === 'email' || question.type === 'textarea') {
                const field = document.getElementById(question.id);
                const value = field.value.trim();

                if (question.required && value === '') {
                    isValid = false;
                    message = 'This field is required';
                } else if (value !== '') {
                    if (question.validation?.minLength && value.length < question.validation.minLength) {
                        isValid = false;
                        message = `Minimum ${question.validation.minLength} characters required`;
                    } else if (question.validation?.maxLength && value.length > question.validation.maxLength) {
                        isValid = false;
                        message = `Maximum ${question.validation.maxLength} characters allowed`;
                    } else if (question.validation?.pattern && !question.validation.pattern.test(value)) {
                        isValid = false;
                        if (question.type === 'email') {
                            message = 'Please enter a valid email address';
                        } else if (question.id === 'q1') {
                            message = 'Name can only contain letters and spaces';
                        } else {
                            message = 'Invalid format';
                        }
                    } else {
                        message = '✓ Valid';
                        messageType = 'success';
                    }
                } else if (!question.required) {
                    messageType = 'info';
                    message = '';
                }

                field.classList.remove('valid', 'invalid');
                if (value !== '') {
                    field.classList.add(isValid ? 'valid' : 'invalid');
                }
            } else if (question.type === 'radio') {
                const selected = document.querySelector(`input[name="${question.id}"]:checked`);
                
                if (question.required && !selected) {
                    isValid = false;
                    message = 'Please select an option';
                } else if (selected) {
                    message = '✓ Selected';
                    messageType = 'success';
                }
            } else if (question.type === 'checkbox') {
                const selected = document.querySelectorAll(`input[name="${question.id}"]:checked`);
                const count = selected.length;

                if (question.required && count === 0) {
                    isValid = false;
                    message = 'Please select at least one option';
                } else if (question.validation?.minSelections && count < question.validation.minSelections) {
                    isValid = false;
                    message = `Please select at least ${question.validation.minSelections} option(s)`;
                } else if (question.validation?.maxSelections && count > question.validation.maxSelections) {
                    isValid = false;
                    message = `Maximum ${question.validation.maxSelections} selections allowed`;
                } else if (count > 0) {
                    message = `✓ ${count} option(s) selected`;
                    messageType = 'success';
                }
            }

            validationState[question.id] = isValid;

            blockEl.classList.remove('valid', 'invalid');
            if (question.required || (question.type !== 'text' && question.type !== 'email' && question.type !== 'textarea')) {
                blockEl.classList.add(isValid ? 'valid' : 'invalid');
            }

            if (message) {
                messageEl.textContent = message;
                messageEl.className = `validation-message ${messageType} show`;
            } else {
                messageEl.className = 'validation-message';
            }

            updateProgress();
            updateSubmitButton();
        }

        function updateProgress() {
            const validCount = Object.values(validationState).filter(v => v === true).length;
            const total = surveyQuestions.length;
            const percentage = Math.round((validCount / total) * 100);

            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${percentage}% Complete (${validCount}/${total})`;
        }

        function updateSubmitButton() {
            const allValid = Object.values(validationState).every(v => v === true);
            document.getElementById('submitBtn').disabled = !allValid;
        }

        function collectResponses() {
            responses = {};
            
            surveyQuestions.forEach(q => {
                if (q.type === 'text' || q.type === 'email' || q.type === 'textarea') {
                    responses[q.id] = {
                        question: q.question,
                        answer: document.getElementById(q.id).value.trim()
                    };
                } else if (q.type === 'radio') {
                    const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                    responses[q.id] = {
                        question: q.question,
                        answer: selected ? selected.value : 'Not answered'
                    };
                } else if (q.type === 'checkbox') {
                    const selected = Array.from(document.querySelectorAll(`input[name="${q.id}"]:checked`))
                        .map(cb => cb.value);
                    responses[q.id] = {
                        question: q.question,
                        answer: selected.length > 0 ? selected.join(', ') : 'Not answered'
                    };
                }
            });
        }

        function showValidationSummary() {
            const errors = [];
            
            surveyQuestions.forEach((q, index) => {
                if (!validationState[q.id]) {
                    errors.push(`Question ${index + 1}: ${q.question}`);
                }
            });

            const summaryEl = document.getElementById('validationSummary');
            const errorListEl = document.getElementById('errorList');

            if (errors.length > 0) {
                errorListEl.innerHTML = errors.map(e => `<li>${e}</li>`).join('');
                summaryEl.classList.add('show');
                summaryEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                summaryEl.classList.remove('show');
            }
        }

        function resetForm() {
            if (confirm('Are you sure you want to reset the form? All your answers will be lost.')) {
                document.getElementById('surveyForm').reset();
                
                surveyQuestions.forEach(q => {
                    validationState[q.id] = !q.required;
                    
                    const field = document.getElementById(q.id);
                    if (field) {
                        field.classList.remove('valid', 'invalid');
                    }
                    
                    const block = document.getElementById(`block-${q.id}`);
                    block.classList.remove('valid', 'invalid');
                    
                    const message = document.getElementById(`message-${q.id}`);
                    message.className = 'validation-message';
                    
                    const counter = document.getElementById(`counter-${q.id}`);
                    if (counter) {
                        const max = q.validation?.maxLength || 0;
                        counter.textContent = `0 / ${max}`;
                        counter.classList.remove('warning', 'error');
                    }
                });

                document.getElementById('validationSummary').classList.remove('show');
                updateProgress();
                updateSubmitButton();
            }
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
            resetForm();
        }

        document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            surveyQuestions.forEach(q => validateField(q));

            const allValid = Object.values(validationState).every(v => v === true);

            if (!allValid) {
                showValidationSummary();
                return;
            }

            collectResponses();

            const summaryHTML = Object.values(responses)
                .filter(r => r.answer !== 'Not answered')
                .map(r => `
                    <div class="response-item">
                        <div class="response-question">${r.question}</div>
                        <div class="response-answer">${r.answer}</div>
                    </div>
                `).join('');

            document.getElementById('responseSummary').innerHTML = summaryHTML;
            document.getElementById('successModal').classList.add('show');
        });

        generateQuestions();
    </script>
</body>
</html>
