<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Product Card */
        .product-card {
            width: 300px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 50px auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* Product Image */
        .product-card img {
            width: 100%;
            border-radius: 6px;
        }

        /* Title */
        .product-card h2 {
            margin: 15px 0 10px;
            font-size: 20px;
        }

        /* Description */
        .product-card p {
            font-size: 14px;
            color: #555;
        }

        /* Price */
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #2c7be5;
            margin: 10px 0;
        }

        /* Button */
        .buy-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2c7be5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.3s, transform 0.2s;
        }

        /* Hover Effect */
        .buy-btn:hover {
            background-color: #1a5fd0;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image">

        <h2>Wireless Headphones</h2>

        <p>High-quality wireless headphones with noise cancellation and long battery life.</p>

        <div class="price">₹2,499</div>

        <button class="buy-btn">Buy Now</button>
    </div>

</body>
</html>
