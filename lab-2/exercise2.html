<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Audio & Video Player</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; line-height: 1.6; }
        .media-container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; background-color: #f9f9f9; }
        .time-display { font-weight: bold; color: rgb(228, 14, 96); margin-top: 10px; }
        video { width: 100%; max-width: 600px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Multimedia Showcase</h1>

    <section class="media-container">
        <h2>Audio Player</h2>
        <audio id="myAudio" controls>
            <source src="files/a thousand years - Christina Perri.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <div class="time-display">Current Time: <span id="audioTime">0:00</span></div>
    </section>

    <section class="media-container">
        <h2>Video Player</h2>
        <video id="myVideo" controls poster="thumbnail.jpg">
            <source src="files/video.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
        <div class="time-display">Current Time: <span id="videoTime">0:00</span></div>
    </section>

    <script>
        // Function to update the time display
        function updateTime(mediaElement, displayElement) {
            mediaElement.addEventListener('timeupdate', () => {
                const minutes = Math.floor(mediaElement.currentTime / 60);
                const seconds = Math.floor(mediaElement.currentTime % 60);
                // Formatting seconds to always show two digits (e.g., 0:05 instead of 0:5)
                const formattedSeconds = seconds < 10 ? `0${seconds}` : seconds;
                displayElement.innerText = `${minutes}:${formattedSeconds}`;
            });
        }

        // Initialize listeners
        const audio = document.getElementById('myAudio');
        const audioDisplay = document.getElementById('audioTime');
        const video = document.getElementById('myVideo');
        const videoDisplay = document.getElementById('videoTime');

        updateTime(audio, audioDisplay);
        updateTime(video, videoDisplay);
    </script>

</body>
</html>
