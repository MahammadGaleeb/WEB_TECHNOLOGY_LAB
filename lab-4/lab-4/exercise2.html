<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX live product search · debounced</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f2f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -10px rgba(10, 30, 60, 0.3);
            border: 1px solid rgba(255,255,255,0.5);
            padding: 2.2rem 2rem;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #0c2b4b;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.5rem;
        }
        h1 span {
            background: #1a4972;
            color: white;
            font-size: 0.9rem;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .subhead {
            color: #2b4b75;
            margin-bottom: 2.2rem;
            font-size: 1rem;
            border-left: 5px solid #3f7eb6;
            padding-left: 1.2rem;
            background: linear-gradient(to right, #e3efff, transparent);
            border-radius: 0 4px 4px 0;
            line-height: 1.4;
        }
        .search-section {
            position: relative;
            margin-bottom: 2.5rem;
        }
        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            opacity: 0.7;
            pointer-events: none;
        }
        #searchInput {
            width: 100%;
            padding: 1.4rem 1.4rem 1.4rem 4rem;
            font-size: 1.2rem;
            border: 2px solid white;
            background: rgba(255,255,255,0.9);
            border-radius: 60px;
            outline: none;
            box-shadow: 0 10px 25px rgba(0, 30, 60, 0.1);
            transition: all 0.2s;
            font-weight: 400;
        }
        #searchInput:focus {
            border-color: #146ebe;
            box-shadow: 0 15px 30px rgba(0, 80, 150, 0.2);
            background: white;
        }
        #searchInput::placeholder {
            color: #7f9bc0;
            font-weight: 300;
            letter-spacing: 0.2px;
        }
        .loader-ring {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 2rem;
            height: 2rem;
            border: 3px solid #cfdff0;
            border-top: 3px solid #1f6193;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: translateY(-50%) rotate(0deg); } 100% { transform: translateY(-50%) rotate(360deg); } }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
            background: #e6f0fa;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #0b3b5e;
            flex-wrap: wrap;
        }
        .product-count {
            font-weight: 600;
            background: white;
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }
        .json-badge {
            background: #d5e5ff;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-family: monospace;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .json-badge code {
            background: #103656;
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.8rem;
        }
        .error-message {
            background: #ffeae5;
            border: 2px solid #e06b5e;
            color: #a13024;
            padding: 1rem 1.5rem;
            border-radius: 60px;
            font-weight: 500;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1rem;
        }
        .error-message.hidden {
            display: none;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
            margin-top: 1.8rem;
        }
        .product-card {
            background: white;
            border-radius: 1.8rem;
            padding: 1.5rem 1.2rem 1.2rem 1.5rem;
            box-shadow: 0 8px 22px rgba(0, 20, 40, 0.08);
            border: 1px solid rgba(255,255,255,0.7);
            transition: transform 0.15s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 30px rgba(0, 45, 80, 0.12);
        }
        .product-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0e2e4a;
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-category {
            display: inline-block;
            background: #deeaf9;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #1d4b7a;
            text-transform: uppercase;
            margin: 0.5rem 0 0.8rem;
            align-self: flex-start;
        }
        .product-price {
            font-size: 2rem;
            font-weight: 700;
            color: #15507b;
            margin-top: auto;
            line-height: 1.2;
        }
        .product-price small {
            font-size: 1rem;
            font-weight: 400;
            color: #6183a8;
        }
        .no-results {
            grid-column: 1 / -1;
            background: #eaf1fc;
            border-radius: 4rem;
            padding: 3rem 2rem;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 500;
            color: #2f557b;
            border: 2px dashed #9ab8dd;
            margin-top: 1rem;
        }
        .no-results span {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .footer-note {
            margin-top: 2.5rem;
            text-align: center;
            color: #48749e;
            font-size: 0.9rem;
            background: #e1edfd;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .footer-note strong {
            background: #0d3357;
            color: white;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            margin: 0 0.3rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🔍 live product search
        <span>AJAX · JSON</span>
    </h1>
    <div class="subhead">
        type to filter from local product catalog • debounced 350ms
    </div>

    <!-- search field with loader -->
    <div class="search-section">
        <span class="search-icon">🔎</span>
        <input type="text" id="searchInput" placeholder="Search for shoes, laptop, camera ..." autofocus>
        <div class="loader-ring" id="searchLoader"></div>
    </div>

    <!-- status / error / count -->
    <div class="info-bar">
        <span class="product-count" id="resultCount">📦 0 products</span>
        <span class="json-badge">
            📁 local &nbsp; <code>products.json</code> 
            <span style="color:#224d7a;">(simulated)</span>
        </span>
    </div>

    <!-- error message container (hidden by default) -->
    <div id="errorBox" class="error-message hidden">
        <span>⚠️</span> <span id="errorText">Something went wrong. Using fallback data.</span>
    </div>

    <!-- product grid injected dynamically -->
    <div id="productGrid" class="product-grid">
        <!-- will be filled by JS -->
    </div>

    <!-- extra note -->
    <div class="footer-note">
        ⚡ debounced fetch • <strong>350ms</strong> • simulated random error (10%)
    </div>
</div>

<script>
    (function() {
        // ---------- embedded local JSON product catalog (simulates /products.json) ----------
        const LOCAL_PRODUCTS = [
            { id: 1, name: "Ultraboost Shoes", price: 189.99, category: "Footwear" },
            { id: 2, name: "MacBook Pro 14", price: 1999.00, category: "Laptops" },
            { id: 3, name: "Noise Cancelling Headphones", price: 249.50, category: "Audio" },
            { id: 4, name: "Mechanical Keyboard", price: 129.99, category: "Accessories" },
            { id: 5, name: "Wireless Mouse", price: 39.90, category: "Accessories" },
            { id: 6, name: "4K Action Camera", price: 349.95, category: "Cameras" },
            { id: 7, name: "Yoga Mat (Eco)", price: 28.40, category: "Fitness" },
            { id: 8, name: "Stainless Water Bottle", price: 22.50, category: "Lifestyle" },
            { id: 9, name: "LED Desk Lamp", price: 59.99, category: "Home" },
            { id: 10, name: "Backpack 25L", price: 79.90, category: "Bags" },
            { id: 11, name: "Smartwatch Series 5", price: 279.00, category: "Wearables" },
            { id: 12, name: "E-reader Paperwhite", price: 149.99, category: "Tablets" },
            { id: 13, name: "Portable SSD 1TB", price: 129.99, category: "Storage" },
            { id: 14, name: "Gaming Chair", price: 329.95, category: "Furniture" },
            { id: 15, name: "Espresso Machine", price: 499.00, category: "Appliances" },
            { id: 16, name: "Yoga Block (set of 2)", price: 18.75, category: "Fitness" },
            { id: 17, name: "Desk Organizer", price: 34.90, category: "Office" },
            { id: 18, name: "Phone Tripod", price: 29.99, category: "Camera" }
        ];

        // ---------- DOM references ----------
        const searchInput = document.getElementById('searchInput');
        const loader = document.getElementById('searchLoader');
        const productGrid = document.getElementById('productGrid');
        const resultCountSpan = document.getElementById('resultCount');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');

        // ---------- state ----------
        let currentAbortController = null;       // to cancel pending fetch
        let lastQuery = '';                       // to avoid duplicate identical requests
        let debounceTimer = null;
        let currentProducts = [];                  // last displayed products

        // ---------- helpers: render product cards ----------
        function renderProducts(products, query = '') {
            if (!products || products.length === 0) {
                // show "no results found" placeholder
                productGrid.innerHTML = `<div class="no-results"><span>🔎🕳️</span> No results found for "${query}"</div>`;
                resultCountSpan.textContent = `📦 0 products`;
                return;
            }

            const html = products.map(p => {
                // Format price nicely (always two decimals)
                const formattedPrice = p.price.toFixed(2);
                return `
                    <div class="product-card">
                        <div class="product-name">${escapeHTML(p.name)}</div>
                        <div class="product-category">${escapeHTML(p.category)}</div>
                        <div class="product-price"><small>$</small>${formattedPrice}</div>
                    </div>
                `;
            }).join('');

            productGrid.innerHTML = html;
            resultCountSpan.textContent = `📦 ${products.length} product${products.length > 1 ? 's' : ''}`;
        }

        // simple escape (XSS protection)
        function escapeHTML(str) {
            return String(str).replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        // show error message (optionally with custom text)
        function showError(message = 'Failed to load products. Using fallback.') {
            errorText.textContent = message;
            errorBox.classList.remove('hidden');
        }

        function hideError() {
            errorBox.classList.add('hidden');
        }

        // set loading indicator on/off
        function setLoading(isLoading) {
            loader.style.display = isLoading ? 'block' : 'none';
        }

        // This function simulates an AJAX fetch (using fetch API) with a local JSON endpoint,
        // but we embed the data. To stay true to the exercise, we simulate network latency,
        // possible random failure, and treat it as if it's fetching from a local JSON file.
        function fetchProducts(searchTerm) {
            // If there's an existing request, abort it
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }

            const trimmed = searchTerm.trim();
            // if empty, we could return all products but let's respect empty — show all? Yes, typical search shows all when empty.
            // but we still want to go through fetch.

            // Create new AbortController for this fetch
            const controller = new AbortController();
            currentAbortController = controller;
            const signal = controller.signal;

            setLoading(true);
            hideError();  // hide previous error

            // Simulate network delay (between 300 and 600 ms) + possible random failure (10%)
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    // If the request was aborted, reject with AbortError
                    if (signal.aborted) {
                        reject(new DOMException('Aborted', 'AbortError'));
                        return;
                    }

                    // Simulate random server error (10% chance)
                    if (Math.random() < 0.1) {   // 10% failure to show error handling
                        reject(new Error('Internal server error (simulated)'));
                        return;
                    }

                    // Success: filter products based on search term (case‑insensitive, partial match)
                    let results = LOCAL_PRODUCTS;
                    if (trimmed !== '') {
                        const lowerTerm = trimmed.toLowerCase();
                        results = LOCAL_PRODUCTS.filter(p => 
                            p.name.toLowerCase().includes(lowerTerm) || 
                            p.category.toLowerCase().includes(lowerTerm)
                        );
                    }

                    resolve(results);
                }, 400); // fixed 400ms delay, feel free to change
            }).finally(() => {
                // Only clear loading if this controller is still the current one
                if (currentAbortController === controller) {
                    setLoading(false);
                    currentAbortController = null;
                }
            });
        }

        // Core search handler – debounced
        function handleSearchInput() {
            const query = searchInput.value;

            // cancel previous timer
            if (debounceTimer) clearTimeout(debounceTimer);

            // cancel any pending fetch
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }

            // If query is empty, we still want to show all products (but with a debounce)
            debounceTimer = setTimeout(() => {
                performSearch(query);
            }, 350); // debounce 350ms
        }

        async function performSearch(query) {
            // Avoid identical searches (but if query differs, proceed)
            if (lastQuery === query) {
                // but we might want to still show existing results; do nothing.
                return;
            }
            lastQuery = query;

            try {
                // fetchProducts returns a promise with filtered array
                const products = await fetchProducts(query);
                
                // render products (even empty array results in 'no results' placeholder)
                renderProducts(products, query);
                
                // If we got empty array, that's not an error, but we show "no results" inside renderProducts
                // hide any error, because it's a valid response
                hideError();
            } catch (err) {
                // Ignore aborted errors (they are expected when typing quickly)
                if (err.name === 'AbortError' || err.message === 'Aborted') {
                    return;
                }

                // Show error message
                showError(`⚠️ ${err.message || 'could not fetch products'}. Showing cached / fallback?`);

                // Fallback: filter local products manually (since JSON failed) to keep UI interactive
                // but we still want to display results based on last query, using LOCAL_PRODUCTS directly.
                // That way the user sees something even if "server" fails.
                const trimmed = query.trim().toLowerCase();
                const fallbackResults = trimmed ? 
                    LOCAL_PRODUCTS.filter(p => p.name.toLowerCase().includes(trimmed) || p.category.toLowerCase().includes(trimmed)) :
                    LOCAL_PRODUCTS;

                renderProducts(fallbackResults, query);
                // keep error message visible
            } finally {
                // cleanup if needed
            }
        }

        // initial render: show all products (as if page just loaded, with no search)
        function initialRender() {
            renderProducts(LOCAL_PRODUCTS, '');
            lastQuery = ''; // ensure consistency
        }

        // attach debounced event listener
        searchInput.addEventListener('input', handleSearchInput);

        // simulate an initial "fetch" from JSON to load all products? we can simply render local directly
        // but to stay consistent with AJAX, we could do an initial fetch with empty query.
        // Let's do an initial fetch (empty) to show AJAX loading on page start, as if page loaded and fetched.
        window.addEventListener('load', () => {
            // small delay to demonstrate loader
            setLoading(true);
            // simulate first load (empty search)
            setTimeout(() => {
                // we don't want to abort anything
                fetchProducts('')      // returns all products
                    .then(products => {
                        renderProducts(products, '');
                        hideError();
                    })
                    .catch(err => {
                        if (err.name !== 'AbortError') {
                            showError('Initial load failed, using fallback');
                            renderProducts(LOCAL_PRODUCTS, '');
                        }
                    })
                    .finally(() => {
                        setLoading(false);
                    });
            }, 300);
        });

        // additional safeguard: if user submits form (if any) prevent
        // but we have no form, so fine
    })();
</script>
</body>
</html>
